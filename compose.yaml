services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: inventory_stage2_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a password for the disposable local database}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_stage2_test"]
      interval: 3s
      timeout: 3s
      retries: 20
